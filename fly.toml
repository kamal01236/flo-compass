# Flo Compass — optional Fly.io (NOT the default production path)
# Default hosting is GitHub Pages via .github/workflows/ci-deploy.yml
# (Asset OS pattern). Keep this file only if you intentionally re-enable Fly.
#
# After `fly apps create <name>`, set app below (or repo variable FLY_APP_NAME).

app = 'flo-compass'
primary_region = 'iad'

[build]
  dockerfile = 'docker/Dockerfile'
  [build.args]
    CONFIG_PROFILE = 'prod'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
