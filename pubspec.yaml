name: flo_compass
description: "Flo Compass — Flo 2026 event companion at Nagarro Gurgaon Office."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^17.0.0
  shared_preferences: ^2.5.3
  http: ^1.4.0
  qr_flutter: ^4.1.0
  web: ^1.1.1
  get_it: ^8.0.0
  logger: ^2.5.0
  intl: ^0.20.0
  crypto: ^3.0.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.ttf
  assets:
    - assets/data/flo2026_meta.json
    - assets/data/flo2026_venues.json
    - assets/data/flo2026_tracks.json
    - assets/data/flo2026_speakers.json
    - assets/data/flo2026_sessions.json
    - assets/data/flo2026_session_overrides.json
    - assets/data/flo2026_session_qa.json
    - assets/data/session_a11y.json
    - assets/data/learning_paths.json
    - assets/data/flo2026_amenities.json
    - assets/data/flo_meets_purposes.json
    - assets/data/flo_meets_personal_interests.json
    - assets/data/flo_meets_personality_traits.json
    - assets/data/meet_nickname_pool.json
    - assets/data/flo_meets_mock_partners.json
    - assets/data/flo_meets_match_weights.json
    - assets/data/flo_meets_rooms.json
    - assets/data/flo2026_navigation_hints.json
    - assets/data/flo2026_campus.json
    - assets/data/flo_meets_taxonomy.json
    - assets/data/schema/
    - assets/images/speakers/
    - assets/config/
