workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  # Hackathon demo: loads config.dev.json (mockRole admin). Set to prod before production cutover.
  CONFIG_PROFILE: "dev"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  GIT_DEPTH: 1
  DOCKERFILE_PATH: docker/Dockerfile
  FOLDER_TO_ZIP: "hackathon-docs"

stages:
  - validate
  - build_deploy
  - upload_docs
  - coverage

validate_flo_data:
  stage: validate
  image: ghcr.io/cirruslabs/flutter:3.44.0
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - flutter pub get
    - dart run tools/validate_flo_data.dart
    - flutter analyze
    - flutter test
    - bash scripts/check_layer_boundaries.sh
    - bash scripts/check_route_constants.sh

build_and_deploy:
  stage: build_deploy
  needs:
    - validate_flo_data
  image: docker:24-cli
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - export REPO_NAME_LOWER=$(echo "$CI_PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
    - export IMAGE_NAME="${DOCKER_REGISTRY}/${REPO_NAME_LOWER}"
    - export CONTAINER_APP_NAME="${REPO_NAME_LOWER}"
    - echo "${DOCKER_PASSWORD}" | docker login "${DOCKER_REGISTRY}" -u "${DOCKER_USERNAME}" --password-stdin
  script:
    - docker pull "${IMAGE_NAME}:latest" || true
    - docker build -f "${DOCKERFILE_PATH}"
        --build-arg CONFIG_PROFILE="${CONFIG_PROFILE:-default}"
        --build-arg BUILD_SHA="${CI_COMMIT_SHORT_SHA}"
        -t "${IMAGE_NAME}:latest"
        -t "${IMAGE_NAME}:${IMAGE_TAG}"
        --cache-from "${IMAGE_NAME}:latest"
        .
    - docker push "${IMAGE_NAME}:latest" &
    - LATEST_PUSH_PID=$!
    - docker push "${IMAGE_NAME}:${IMAGE_TAG}"
    - wait "${LATEST_PUSH_PID}"
    - |
      docker run --rm \
        -v "$(pwd)/docker:/workspace" \
        -e AZURE_CLIENT_ID="${AZURE_CLIENT_ID}" \
        -e AZURE_CLIENT_SECRET="${AZURE_CLIENT_SECRET}" \
        -e AZURE_TENANT_ID="${AZURE_TENANT_ID}" \
        -e AZURE_SUBSCRIPTION_ID="${AZURE_SUBSCRIPTION_ID}" \
        -e AZURE_RESOURCE_GROUP="${AZURE_RESOURCE_GROUP}" \
        -e CONTAINER_APP_ENVIRONMENT="${CONTAINER_APP_ENVIRONMENT}" \
        -e DOCKER_REGISTRY="${DOCKER_REGISTRY}" \
        -e DOCKER_USERNAME="${DOCKER_USERNAME}" \
        -e DOCKER_PASSWORD="${DOCKER_PASSWORD}" \
        -e IMAGE_NAME="${IMAGE_NAME}" \
        -e IMAGE_TAG="${IMAGE_TAG}" \
        -e CONTAINER_APP_NAME="${CONTAINER_APP_NAME}" \
        -e REGISTRATION_API_URL="${REGISTRATION_API_URL}" \
        -e CI_PIPELINE_ID="${CI_PIPELINE_ID}" \
        mcr.microsoft.com/azure-cli:2.61.0 bash -c '
        set -e
        az login --service-principal -u "${AZURE_CLIENT_ID}" -p "${AZURE_CLIENT_SECRET}" --tenant "${AZURE_TENANT_ID}"
        az account set --subscription "${AZURE_SUBSCRIPTION_ID}"
        APP_URL=$(az deployment group create \
          --name "deploy-${CI_PIPELINE_ID}" \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --template-file /workspace/arm-template.json \
          --parameters containerAppName="${CONTAINER_APP_NAME}" environmentName="${CONTAINER_APP_ENVIRONMENT}" dockerRegistry="${DOCKER_REGISTRY}" dockerUsername="${DOCKER_USERNAME}" dockerPassword="${DOCKER_PASSWORD}" imageName="${IMAGE_NAME}" imageTag="${IMAGE_TAG}" \
          --query "properties.outputs.fqdn.value" -o tsv)
        echo "Deployed to https://${APP_URL}"
      '

compress_and_upload:
  stage: upload_docs
  needs:
    - build_and_deploy
  image: docker:24-cli
  script:
    - export TEAM_NAME=$(echo "$CI_PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
    - |
      docker run --rm \
        -v "$(pwd):/workspace" \
        -e TEAM_NAME="${TEAM_NAME}" \
        -e AZURE_STORAGE_ACCOUNT="${Application_Artifact_Storage_Name}" \
        -e AZURE_STORAGE_KEY="${Application_Artifact_Storage_Key}" \
        mcr.microsoft.com/azure-cli:2.61.0 bash -c '
        set -e
        CONTAINER="${TEAM_NAME}"
        az storage container create --name "${CONTAINER}" --account-name "${AZURE_STORAGE_ACCOUNT}" --account-key "${AZURE_STORAGE_KEY}" 2>/dev/null || true
        cd /workspace/hackathon-docs
        az storage blob upload-batch --source "." --destination "${CONTAINER}" --account-name "${AZURE_STORAGE_ACCOUNT}" --account-key "${AZURE_STORAGE_KEY}" --max-connections 16 --overwrite true
        az storage blob list --container-name "${CONTAINER}" --account-name "${AZURE_STORAGE_ACCOUNT}" --account-key "${AZURE_STORAGE_KEY}" --query "[].name" -o tsv | while read -r blob_name; do
          if [ -n "$blob_name" ] && [ ! -f "$blob_name" ]; then
            echo "🗑️  Deleting orphaned blob: $blob_name"
            az storage blob delete --container-name "${CONTAINER}" --name "$blob_name" --account-name "${AZURE_STORAGE_ACCOUNT}" --account-key "${AZURE_STORAGE_KEY}"
          fi
        done
      '

# Optional coverage gate — runs after successful deploy without blocking it on the
# first pass. Flip `allow_failure: false` once the branch baseline is known good.
coverage_report:
  stage: coverage
  needs:
    - build_and_deploy
  image: ghcr.io/cirruslabs/flutter:3.44.0
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - flutter pub get
    - bash scripts/wsl_coverage.sh
  artifacts:
    when: always
    paths:
      - coverage/lcov.info
    expire_in: 7 days