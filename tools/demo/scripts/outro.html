<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Flo Compass — Thank you</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(ellipse at center, #0f1319 0%, #05060a 65%);
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        overflow: hidden;
      }
      .slate {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 32px;
      }
      .wordmark {
        font-size: 128px;
        font-weight: 700;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #34d399 0%, #10b981 45%, #059669 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tag {
        font-size: 32px;
        color: #d4d4d8;
      }
      .team {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 22px;
        color: #a1a1aa;
      }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }
      .footer {
        position: absolute;
        bottom: 48px;
        font-size: 18px;
        color: #52525b;
      }
      .accent {
        color: #10b981;
      }
    </style>
  </head>
  <body>
    <div class="slate">
      <div class="wordmark">Flo Compass</div>
      <div class="tag">Built with <span class="accent">Cursor</span> · ai-avengers</div>
      <div class="team">
        <span>The Waters of Innovation</span>
        <span class="dot"></span>
        <span>Episode 2</span>
        <span class="dot"></span>
        <span>Nagarro Gurgaon Office</span>
      </div>
    </div>
    <div class="footer">Flo 2026 · demo · complements Accelevents</div>
  </body>
</html>
