# Deploy Flo Compass Flutter web as static GitHub Pages (Asset OS pattern).
# Site: https://kamal01236.github.io/flo-compass/
#
# Prerequisites (both required or deploy-pages returns 404):
# 1. Repo is public (Free) or private with GitHub Pro/Team/Enterprise
# 2. Settings → Pages → Build and deployment → Source = GitHub Actions
#    https://github.com/kamal01236/flo-compass/settings/pages
#
# Local Docker/nginx (Tier 2) remains for smoke tests; Fly.io is optional and
# no longer part of the default production path.
name: CI and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CONFIG_PROFILE: prod
  PAGES_BASE_HREF: /flo-compass/

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Validate Flo data
        run: dart run tools/validate_flo_data.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Layer boundaries
        run: bash scripts/check_layer_boundaries.sh

      - name: Route constants
        run: bash scripts/check_route_constants.sh

  build-pages:
    name: Build static web
    needs: validate
    if: >
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Build web
        run: |
          set -euo pipefail
          flutter pub get
          # Disable deprecated Flutter SW stub; bundle CanvasKit locally for CSP.
          # --base-href matches project Pages URL under username.github.io/<repo>/
          flutter build web --release \
            --pwa-strategy=none \
            --no-web-resources-cdn \
            --base-href "${PAGES_BASE_HREF}" \
            --dart-define=CONFIG_PROFILE=${CONFIG_PROFILE} \
            --dart-define=BUILD_SHA=${{ github.sha }}
          # GitHub Pages has no SPA try_files; serve index for unknown paths.
          cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-pages
    if: >
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summary
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "### Deployed (GitHub Pages)" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: ${url}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deep link: ${url}session/s-001" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pattern: same as asset-os (static flutter web via Actions)" >> "$GITHUB_STEP_SUMMARY"
