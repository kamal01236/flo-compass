name: CI and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CONFIG_PROFILE: prod

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Validate Flo data
        run: dart run tools/validate_flo_data.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Layer boundaries
        run: bash scripts/check_layer_boundaries.sh

      - name: Route constants
        run: bash scripts/check_route_constants.sh

  build-and-push:
    name: Build and push image
    needs: validate
    if: >
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.full }}
      tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: image
        run: |
          full="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "full=${full}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.full }}:latest
            ${{ steps.image.outputs.full }}:${{ github.sha }}
          build-args: |
            CONFIG_PROFILE=${{ env.CONFIG_PROFILE }}
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Fly.io
    needs: build-and-push
    # Skips until FLY_API_TOKEN is configured (see README).
    if: >
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::notice::FLY_API_TOKEN secret not set — image pushed to GHCR; skipping Fly deploy."
            echo "Image: ${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}"
            exit 0
          fi
          echo "FLY_READY=1" >> "$GITHUB_ENV"

      - name: Setup flyctl
        if: env.FLY_READY == '1'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        if: env.FLY_READY == '1'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="${{ vars.FLY_APP_NAME }}"
          if [ -z "${APP}" ]; then
            APP=$(awk -F"'" '/^app[[:space:]]*=/ {print $2; exit}' fly.toml)
          fi
          if [ -z "${APP}" ]; then
            echo "::error::Set repository variable FLY_APP_NAME or app = '...' in fly.toml"
            exit 1
          fi
          IMAGE="${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}"
          echo "Deploying ${IMAGE} to Fly app ${APP}"
          flyctl deploy \
            --app "${APP}" \
            --config fly.toml \
            --image "${IMAGE}" \
            --remote-only \
            --ha=false
          echo "Deployed to https://${APP}.fly.dev"
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: \`${APP}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://${APP}.fly.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deep link: https://${APP}.fly.dev/session/s-001" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: https://${APP}.fly.dev/health" >> "$GITHUB_STEP_SUMMARY"
