# Deploy Flo Compass Flutter web as static GitHub Pages (Asset OS pattern).
# Site: https://kamal01236.github.io/flo-compass/
#
# First-time setup (browser — GITHUB_TOKEN cannot create the Pages site):
#   Settings → Pages → Source = GitHub Actions  OR  branch gh-pages / (root)
#   https://github.com/kamal01236/flo-compass/settings/pages
name: CI and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CONFIG_PROFILE: prod
  PAGES_BASE_HREF: /flo-compass/

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Validate Flo data
        run: dart run tools/validate_flo_data.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Layer boundaries
        run: bash scripts/check_layer_boundaries.sh

      - name: Route constants
        run: bash scripts/check_route_constants.sh

  pages-config:
    name: Detect Pages Actions source
    if: >
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      actions_deploy: ${{ steps.detect.outputs.actions_deploy }}
    steps:
      - name: Detect whether Actions-based Pages is enabled
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>/dev/null || true)"
          if [ -z "${body}" ]; then
            echo "actions_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Pages site not created yet — skipping Actions deploy (enable in Settings → Pages)."
            exit 0
          fi
          build_type="$(printf '%s' "${body}" | jq -r '.build_type // empty')"
          if [ "${build_type}" = "workflow" ]; then
            echo "actions_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Pages Actions source detected."
          else
            echo "actions_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Pages source is not GitHub Actions (build_type=${build_type:-unknown}) — using gh-pages branch publish."
          fi

  build:
    name: Build static web
    needs: [validate, pages-config]
    if: >
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Build web
        run: |
          set -euo pipefail
          flutter pub get
          flutter build web --release \
            --pwa-strategy=none \
            --no-web-resources-cdn \
            --base-href "${PAGES_BASE_HREF}" \
            --dart-define=CONFIG_PROFILE=${CONFIG_PROFILE} \
            --dart-define=BUILD_SHA=${{ github.sha }}
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Upload Pages artifact
        if: needs.pages-config.outputs.actions_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: build/web
          retention-days: 1

  publish-gh-pages-branch:
    name: Publish gh-pages branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: site

      - name: Push static site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: static Flo Compass web (${{ github.sha }})"

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [build, pages-config]
    if: needs.pages-config.outputs.actions_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployed: ${{ steps.deployment.outcome == 'success' }}
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-report:
    name: Deploy report
    needs: [pages-config, deploy-pages, publish-gh-pages-branch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        env:
          ACTIONS_ENABLED: ${{ needs.pages-config.outputs.actions_deploy }}
          ACTIONS_DEPLOY: ${{ needs.deploy-pages.outputs.deployed }}
          PAGE_URL: ${{ needs.deploy-pages.outputs.page_url }}
          GH_PAGES_OK: ${{ needs.publish-gh-pages-branch.result }}
        run: |
          echo "### Deploy report" >> "$GITHUB_STEP_SUMMARY"
          if [ "${ACTIONS_ENABLED}" = "true" ]; then
            if [ "${ACTIONS_DEPLOY}" = "true" ]; then
              echo "- GitHub Actions Pages: **live** at ${PAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- GitHub Actions Pages: **failed** — see Deploy job logs" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- GitHub Actions Pages: **skipped** (enable Settings → Pages → Source = GitHub Actions for OIDC deploy)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${GH_PAGES_OK}" = "success" ]; then
            echo "- \`gh-pages\` branch: **updated** — enable Pages → branch \`gh-pages\` / root to go live" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- \`gh-pages\` branch: **failed** (${GH_PAGES_OK})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview URL after one-time Pages setup: https://kamal01236.github.io/flo-compass/" >> "$GITHUB_STEP_SUMMARY"
          echo "Settings: https://github.com/${{ github.repository }}/settings/pages" >> "$GITHUB_STEP_SUMMARY"
          if [ "${ACTIONS_ENABLED}" != "true" ]; then
            echo "::notice::Static build published to gh-pages branch. Enable GitHub Pages once in repo settings to serve https://kamal01236.github.io/flo-compass/"
          fi
