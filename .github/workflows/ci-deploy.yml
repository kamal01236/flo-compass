# Deploy Flo Compass Flutter web as static GitHub Pages (Asset OS pattern).
# Site: https://kamal01236.github.io/flo-compass/
#
# First-time setup (one of):
#   A) Settings → Pages → Source = GitHub Actions  (preferred)
#   B) Settings → Pages → Deploy from branch gh-pages / (root)  (fallback)
#
# Local Docker/nginx (Tier 2) remains for smoke tests only.
name: CI and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CONFIG_PROFILE: prod
  PAGES_BASE_HREF: /flo-compass/

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Validate Flo data
        run: dart run tools/validate_flo_data.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Layer boundaries
        run: bash scripts/check_layer_boundaries.sh

      - name: Route constants
        run: bash scripts/check_route_constants.sh

  build:
    name: Build static web
    needs: validate
    if: >
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Build web
        run: |
          set -euo pipefail
          flutter pub get
          flutter build web --release \
            --pwa-strategy=none \
            --no-web-resources-cdn \
            --base-href "${PAGES_BASE_HREF}" \
            --dart-define=CONFIG_PROFILE=${CONFIG_PROFILE} \
            --dart-define=BUILD_SHA=${{ github.sha }}
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

      - name: Upload build artifact (gh-pages fallback)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: build/web
          retention-days: 1

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployed: ${{ steps.deployment.outcome == 'success' }}
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  publish-gh-pages-branch:
    name: Publish gh-pages branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: site

      - name: Push static site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: static Flo Compass web (${{ github.sha }})"

  deploy-report:
    name: Deploy report
    needs: [deploy-pages, publish-gh-pages-branch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        env:
          ACTIONS_DEPLOY: ${{ needs.deploy-pages.outputs.deployed }}
          PAGE_URL: ${{ needs.deploy-pages.outputs.page_url }}
          GH_PAGES_OK: ${{ needs.publish-gh-pages-branch.result }}
        run: |
          set -euo pipefail
          echo "### Deploy report" >> "$GITHUB_STEP_SUMMARY"
          if [ "${ACTIONS_DEPLOY}" = "true" ]; then
            echo "- GitHub Actions Pages: **live** at ${PAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- GitHub Actions Pages: **skipped or failed** (enable Pages → Source = GitHub Actions)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${GH_PAGES_OK}" = "success" ]; then
            echo "- \`gh-pages\` branch: **updated** (fallback: Pages → branch \`gh-pages\` / root)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- \`gh-pages\` branch: **failed**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview URL after one-time Pages setup: https://kamal01236.github.io/flo-compass/" >> "$GITHUB_STEP_SUMMARY"
          echo "Settings: https://github.com/${{ github.repository }}/settings/pages" >> "$GITHUB_STEP_SUMMARY"
          if [ "${ACTIONS_DEPLOY}" != "true" ] && [ "${GH_PAGES_OK}" = "success" ]; then
            echo "::warning::Pages Actions deploy did not run. Enable GitHub Pages (Actions or gh-pages branch) at settings/pages — static files are on gh-pages branch."
          fi
