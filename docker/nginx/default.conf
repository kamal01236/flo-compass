server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;
  gzip_min_length 1024;

  # Flutter entrypoints keep the same URL each build — never immutable-cache them.
  location ~* ^/(flutter_bootstrap|flutter|main\.dart|pwa|shell)\.js$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location ~* \.(js|json|wasm|woff2?|png|jpg|jpeg|svg|ico)$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable, max-age=31536000";
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /health {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
