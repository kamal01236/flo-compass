  <link rel="manifest" href="manifest.json">

  <style>
    .skip-link {
      position: absolute;
      top: -40px;
      left: 8px;
      z-index: 10000;
      padding: 8px 12px;
      border-radius: 8px;
      background: #10B981;
      color: #0C0D12;
      text-decoration: none;
      font-family: system-ui, sans-serif;
    }
    .skip-link:focus {
      top: 8px;
    }
    body {
      margin: 0;
      background: #0C0D12;
    }
    #flo-preloader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0C0D12;
      color: #A1A1AA;
      font-family: system-ui, sans-serif;
      z-index: 9999;
    }
    #flo-preloader .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #1E2030;
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #flo-preloader h1 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      background: linear-gradient(90deg, #10B981, #059669);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#flutter-view">Skip to content</a>
  <noscript>
    Flo Compass requires JavaScript to run. Please enable JavaScript in your browser.
  </noscript>
  <div id="flo-preloader" aria-live="polite">
    <div class="spinner" role="progressbar" aria-label="Loading Flo Compass"></div>
    <h1>Flo Compass</h1>
    <p>Loading Flo 2026 sessions…</p>
  </div>
  <script src="shell.js"></script>
  <script src="pwa.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
