<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Starter Kit</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #0c0d12; color: #e4e4e7; }
    .card { text-align: center; padding: 3rem; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #10b981, #059669); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #a1a1aa; font-size: 1.1rem; }
    code { background: #27272a; padding: 0.2em 0.4em; border-radius: 4px; font-size: 0.9em; color: #34d399; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, World!</h1>

</html>
